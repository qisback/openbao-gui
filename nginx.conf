# Serves the SPA. Traefik terminates TLS and forwards plain HTTP here on lab_net,
# so this listens on 80. All non-file routes fall back to index.html (client-side
# routing).
#
# Security headers are set once at server level; caching uses `expires` (not
# add_header) so the security headers are inherited by every location (nginx drops
# inherited add_header if a location declares its own). The CSP `connect-src`
# origin is a placeholder (__BAO_CSP_ORIGIN__) that docker-entrypoint.sh replaces
# with the origin of $BAO_ADDR at start, so the CSP always matches the API the app
# actually calls.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- security headers (RFC #1364 hardening + audit fixes) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=(), interest-cohort=()" always;
    # No 'unsafe-inline' for scripts or styles (React applies inline styles via the
    # CSSOM, which CSP does not restrict). object/frame fully denied.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' __BAO_CSP_ORIGIN__; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; frame-src 'none'" always;

    # Runtime config: never store (redeploys take effect immediately).
    location = /config.js { expires -1; }

    # Fingerprinted assets: cache hard.
    location /assets/ { expires 1y; try_files $uri =404; }
    location = /favicon.svg { access_log off; expires 1y; }

    # SPA fallback: the HTML document is revalidated every load (no stale app,
    # and the document is never persisted for long).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
